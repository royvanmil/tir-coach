name: APK Tir Coach

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer
        run: npm ci

      - name: Copier le web dans Android
        run: npx cap sync android

      - name: Clé de signature
        env:
          KEYSTORE: ${{ secrets.TIRCOACH_KEYSTORE }}
          PASSWORD: ${{ secrets.TIRCOACH_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/tircoach.keystore
            printf 'storeFile=tircoach.keystore\nstorePassword=%s\nkeyAlias=tircoach\nkeyPassword=%s\n' "$PASSWORD" "$PASSWORD" > android/keystore.properties
          fi

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Renommer
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TirCoach.apk
          cp android/app/build/outputs/bundle/release/app-release.aab TirCoach-PlayStore.aab

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tir Coach - version ${{ github.run_number }}
          files: |
            TirCoach.apk
            TirCoach-PlayStore.aab
          make_latest: true
